<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Learn English — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #212529;
    }

    .login-container {
      text-align: center;
      width: 90%;
      max-width: 360px;
    }

    .logo {
      font-size: 2.2rem;
      font-weight: 800;
      color: #0d6efd;
      margin-bottom: 1.2rem;
      letter-spacing: -0.5px;
    }

    .tagline {
      color: #6c757d;
      font-size: 0.95rem;
      margin-bottom: 2.5rem;
    }

    .google-btn {
      background: #fff;
      border: 1px solid #dee2e6;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 0;
      font-weight: 600;
      font-size: 1rem;
      color: #495057;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
      transition: 0.2s ease;
    }

    .google-btn:hover {
      background-color: #f8f9fa;
    }

    .google-btn img {
      width: 22px;
      height: 22px;
    }

    .footer {
      position: absolute;
      bottom: 18px;
      font-size: 0.8rem;
      color: #adb5bd;
      text-align: center;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo">Learn English</div>
    <div class="tagline">Начни тренировку слов</div>

    <button class="google-btn">
      <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
      Войти через Google
    </button>
  </div>

  <div class="footer">&copy; 2025 Learn English</div>

</body>
</html>
