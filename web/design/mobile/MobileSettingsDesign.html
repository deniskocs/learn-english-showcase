<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Learn English — Настройки</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<style>
body {
  margin: 0;
  background-color: #f2f2f7;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, sans-serif;
  color: #1c1c1e;
  padding-bottom: 80px;
}

/* NAVBAR */
.navbar-ios {
  position: sticky;
  top: 0;
  z-index: 100;
  background-color: rgba(252,252,253,0.95);
  backdrop-filter: blur(8px);
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 1px 0 rgba(0,0,0,0.1);
}
.navbar-ios h1 {
  font-size: 1.15rem;
  font-weight: 600;
  margin: 0;
}

/* SECTION GROUPS */
.settings-group {
  margin-top: 32px;
}
.group-title {
  font-size: 0.75rem;
  font-weight: 600;
  color: #6e6e73;
  text-transform: uppercase;
  margin: 6px 20px 6px;
  letter-spacing: 0.5px;
}
.settings-section {
  background-color: #fff;
  border-radius: 14px;
  margin: 0 16px;
  overflow: hidden;
}
.section-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 18px;
  border-top: 0.5px solid #c6c6c8;
}
.section-item:first-child {
  border-top: none;
}
.section-label {
  font-size: 1rem;
}

/* iOS switch */
.switch {
  position: relative;
  width: 48px;
  height: 28px;
}
.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}
.slider {
  position: absolute;
  cursor: pointer;
  inset: 0;
  background-color: #d1d1d6;
  border-radius: 34px;
  transition: .3s;
}
.slider:before {
  content: "";
  position: absolute;
  height: 22px;
  width: 22px;
  left: 3px;
  bottom: 3px;
  background: #fff;
  border-radius: 50%;
  transition: .3s;
}
input:checked + .slider {
  background-color: #0a84ff;
}
input:checked + .slider:before {
  transform: translateX(20px);
}

/* LOGOUT */
.logout-section {
  background-color: #fff;
  border-radius: 14px;
  margin: 32px 16px;
  overflow: hidden;
}
.logout-item {
  text-align: center;
  color: #ff3b30;
  font-weight: 600;
  padding: 14px 0;
}

/* TAB BAR */
.tabbar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 64px;
  background-color: #fff;
  border-top: 0.5px solid #c6c6c8;
  display: flex;
  justify-content: space-around;
  align-items: center;
}
.tabbar button {
  background: none;
  border: none;
  color: #8e8e93;
  font-size: 0.9rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.tabbar button.active {
  color: #0a84ff;
  font-weight: 600;
}
.tabbar-icon {
  font-size: 1.3rem;
}
</style>
</head>
<body>

<nav class="navbar-ios"><h1>Настройки</h1></nav>

<!-- СЛОВА -->
<div class="settings-group">
  <div class="group-title">Слова</div>
  <div class="settings-section">
    <div class="section-item">
      <div class="section-label">Английский → Русский</div>
      <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
    </div>
    <div class="section-item">
      <div class="section-label">Русский → Английский</div>
      <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
    </div>
    <div class="section-item">
      <div class="section-label">Значение → Слово</div>
      <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
    </div>
  </div>
</div>

<!-- ГЛАГОЛЫ -->
<div class="settings-group">
  <div class="group-title">Глаголы</div>
  <div class="settings-section">
    <div class="section-item">
      <div class="section-label">Неправильные глаголы</div>
      <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
    </div>
    <div class="section-item">
      <div class="section-label">Формы глаголов</div>
      <label class="switch"><input type="checkbox"><span class="slider"></span></label>
    </div>
  </div>
</div>

<!-- ФРАЗОВЫЕ ГЛАГОЛЫ -->
<div class="settings-group">
  <div class="group-title">Фразовые глаголы</div>
  <div class="settings-section">
    <div class="section-item">
      <div class="section-label">Основные фразовые глаголы</div>
      <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
    </div>
    <div class="section-item">
      <div class="section-label">Продвинутые фразовые глаголы</div>
      <label class="switch"><input type="checkbox"><span class="slider"></span></label>
    </div>
  </div>
</div>

<!-- УСТОЙЧИВЫЕ ВЫРАЖЕНИЯ -->
<div class="settings-group">
  <div class="group-title">Устойчивые выражения</div>
  <div class="settings-section">
    <div class="section-item">
      <div class="section-label">Базовые выражения</div>
      <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
    </div>
    <div class="section-item">
      <div class="section-label">Разговорные фразы</div>
      <label class="switch"><input type="checkbox"><span class="slider"></span></label>
    </div>
  </div>
</div>

<!-- LOGOUT -->
<div class="logout-section">
  <div class="logout-item">Выйти из аккаунта</div>
</div>

<!-- TABBAR -->
<nav class="tabbar">
  <button><span class="tabbar-icon">🧠</span><small>Уроки</small></button>
  <button><span class="tabbar-icon">📘</span><small>Словарь</small></button>
  <button><span class="tabbar-icon">🎙️</span><small>Записи</small></button>
  <button class="active"><span class="tabbar-icon">⚙️</span><small>Настройки</small></button>
</nav>

</body>
</html>
