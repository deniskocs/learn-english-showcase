<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Learn English — Фильтры</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<style>
body {
  margin: 0;
  background-color: #f2f2f7;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, sans-serif;
  color: #1c1c1e;
  padding-bottom: 100px; /* место под кнопки */
}

/* --- NAVIGATION BAR --- */
.navbar-ios {
  position: sticky;
  top: 0;
  z-index: 100;
  background-color: rgba(252, 252, 253, 0.95);
  backdrop-filter: blur(8px);
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 1px 0 rgba(0,0,0,0.1);
}
.navbar-ios h1 {
  font-size: 1.15rem;
  font-weight: 600;
  margin: 0;
}
.nav-left {
  position: absolute;
  left: 16px;
  font-size: 1.3rem;
  color: #0a84ff;
  cursor: pointer;
}

/* --- COUNTER --- */
.counter {
  text-align: center;
  font-size: 0.95rem;
  color: #6c757d;
  margin: 12px 0 10px;
}

/* --- SECTION GROUP --- */
.section-title {
  font-size: 0.85rem;
  font-weight: 600;
  color: #6e6e73;
  text-transform: uppercase;
  margin: 20px 20px 8px;
  letter-spacing: 0.4px;
}
.section {
  background-color: #fff;
  border-top: 0.5px solid #c6c6c8;
  border-bottom: 0.5px solid #c6c6c8;
}
.section-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 20px;
  border-top: 0.5px solid #e9ecef;
}
.section-item:first-child {
  border-top: none;
}
.section-label {
  font-size: 1rem;
}

/* iOS-style switch */
.switch {
  position: relative;
  width: 48px;
  height: 28px;
}
.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}
.slider {
  position: absolute;
  cursor: pointer;
  inset: 0;
  background-color: #d1d1d6;
  border-radius: 34px;
  transition: .3s;
}
.slider:before {
  content: "";
  position: absolute;
  height: 22px;
  width: 22px;
  left: 3px;
  bottom: 3px;
  background: #fff;
  border-radius: 50%;
  transition: .3s;
}
input:checked + .slider {
  background-color: #0a84ff;
}
input:checked + .slider:before {
  transform: translateX(20px);
}

/* --- TAGS --- */
.tag-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px 16px 16px;
}
.tag {
  border: 1px solid #dee2e6;
  border-radius: 16px;
  padding: 6px 12px;
  font-size: 0.9rem;
  background-color: #f8f9fa;
  cursor: pointer;
  transition: all 0.2s ease;
}
.tag.active {
  background-color: #0a84ff;
  color: #fff;
  border-color: #0a84ff;
}

/* --- BUTTONS --- */
.actions {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background-color: #fff;
  border-top: 0.5px solid #c6c6c8;
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.actions button {
  border: none;
  border-radius: 10px;
  padding: 12px;
  font-weight: 600;
  font-size: 1rem;
  transition: background 0.2s ease;
}
.apply-btn {
  background-color: #0a84ff;
  color: #fff;
}
.apply-btn:active {
  background-color: #006edc;
}
.reset-btn {
  background-color: #f1f3f5;
  color: #212529;
}
.reset-btn:active {
  background-color: #e9ecef;
}
</style>
</head>
<body>

<!-- NAVIGATION -->
<nav class="navbar-ios">
  <div class="nav-left">←</div>
  <h1>Фильтры</h1>
</nav>

<!-- COUNTER -->
<div class="counter" id="counter">Найдено: 128 слов</div>

<!-- Тип слов -->
<div class="section-title">Тип слов</div>
<div class="section">
  <div class="section-item">
    <div class="section-label">Новые слова</div>
    <label class="switch">
      <input type="checkbox" id="newWords" checked>
      <span class="slider"></span>
    </label>
  </div>
  <div class="section-item">
    <div class="section-label">Повторяемые слова</div>
    <label class="switch">
      <input type="checkbox" id="repeatedWords" checked>
      <span class="slider"></span>
    </label>
  </div>
</div>

<!-- Теги -->
<div class="section-title">Категории (теги)</div>
<div class="section">
  <div class="tag-list">
    <div class="tag active">Бизнес</div>
    <div class="tag active">Путешествия</div>
    <div class="tag active">Фильмы</div>
    <div class="tag">Повседневное</div>
    <div class="tag">Сленг</div>
    <div class="tag">IELTS</div>
    <div class="tag">Работа</div>
    <div class="tag">Музыка</div>
    <div class="tag">Погода</div>
    <div class="tag">Новости</div>
    <div class="tag">Технологии</div>
    <div class="tag">Общение</div>
  </div>
</div>

<!-- BUTTONS -->
<div class="actions">
  <button class="apply-btn">Применить фильтр</button>
  <button class="reset-btn">Сбросить фильтр</button>
</div>

<script>
  const counter = document.getElementById('counter');
  const tags = document.querySelectorAll('.tag');
  const newWords = document.getElementById('newWords');
  const repeatedWords = document.getElementById('repeatedWords');

  // Эмуляция подсчёта слов при изменении выбора
  function updateCount() {
    const activeTags = [...tags].filter(t => t.classList.contains('active')).length;
    const enabledNew = newWords.checked;
    const enabledRepeated = repeatedWords.checked;
    // Просто имитация подсчёта
    let base = 50;
    if (enabledNew) base += 60;
    if (enabledRepeated) base += 40;
    const count = base + activeTags * 5;
    counter.textContent = `Найдено: ${count} слов`;
  }

  tags.forEach(tag => tag.addEventListener('click', () => {
    tag.classList.toggle('active');
    updateCount();
  }));
  [newWords, repeatedWords].forEach(sw => sw.addEventListener('change', updateCount));

</script>

</body>
</html>
