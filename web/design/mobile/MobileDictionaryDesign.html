<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Learn English — Словарь</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, sans-serif;
      color: #212529;
      padding-bottom: 80px;
    }

    /* --- NAVIGATION BAR --- */
    .navbar-ios {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(252, 252, 253, 0.9); /* чуть теплее белый */
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08); /* мягкая, но явная тень */
    }
    .navbar-ios h1 {
      font-size: 1.15rem;
      font-weight: 700;
      margin: 0;
      color: #212529;
    }

    /* --- Segmented Control --- */
    .segment {
      display: inline-flex;
      background-color: #f0f1f5;
      border-radius: 10px;
      padding: 3px;
      margin: 10px 16px 6px;
      width: calc(100% - 32px);
    }
    .segment button {
      flex: 1;
      border: none;
      background: transparent;
      font-weight: 500;
      font-size: 0.95rem;
      color: #495057;
      border-radius: 8px;
      padding: 8px 0;
      transition: all 0.25s ease;
    }
    .segment button.active {
      background-color: #fff;
      color: #0d6efd;
      font-weight: 600;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    /* --- Word List --- */
    .word-list {
      margin: 10px 0;
      padding: 0;
      list-style: none;
    }
    .word-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      border-bottom: 1px solid #cfd1d6;
      transition: background-color 0.15s ease;
    }
    .word-item:active {
      background-color: #f2f4f8;
    }
    .word-item:last-child {
      border-bottom: none;
    }
    .word-text {
      display: flex;
      flex-direction: column;
    }
    .word-en {
      font-weight: 600;
      font-size: 1rem;
    }
    .word-ru {
      font-size: 0.9rem;
      color: #6c757d;
    }
    .word-def {
      font-size: 0.85rem;
      color: #8a8d90;
      margin-top: 2px;
    }

    .sound-btn, .add-btn {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: #0d6efd;
      font-weight: 600;
      padding: 4px 6px;
    }
    .add-btn {
      font-size: 0.85rem;
      border-radius: 8px;
      background-color: #0d6efd;
      color: #fff;
      padding: 6px 10px;
    }

    /* --- Search --- */
    .search-box {
      padding: 10px 16px 0;
    }
    .search-box input {
      width: 100%;
      border-radius: 10px;
      padding: 10px 12px;
      border: 1px solid #dee2e6;
      background-color: #f8f9fa;
      outline: none;
      font-size: 0.95rem;
    }

    /* --- TAB BAR --- */
    .tabbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background-color: #fff;
      border-top: 1px solid #dee2e6;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .tabbar button {
      background: none;
      border: none;
      color: #6c757d;
      font-size: 0.9rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .tabbar button.active {
      color: #0d6efd;
      font-weight: 600;
    }
    .tabbar-icon {
      font-size: 1.3rem;
      line-height: 1;
    }
  </style>
</head>
<body>

  <!-- NavigationBar -->
  <nav class="navbar-ios">
    <h1>Словарь</h1>
  </nav>

  <!-- Segmented Control -->
  <div class="segment">
    <button id="btnActive" class="active">Активные</button>
    <button id="btnAll">Все слова</button>
  </div>

  <!-- Активные слова -->
  <main id="activeWords">
    <ul class="word-list">
      <li class="word-item">
        <div class="word-text">
          <div class="word-en">ability</div>
          <div class="word-ru">способность</div>
          <div class="word-def">the power or skill to do something</div>
        </div>
        <button class="sound-btn">🔊</button>
      </li>
      <li class="word-item">
        <div class="word-text">
          <div class="word-en">accept</div>
          <div class="word-ru">принимать</div>
          <div class="word-def">to receive or take something willingly</div>
        </div>
        <button class="sound-btn">🔊</button>
      </li>
    </ul>
  </main>

  <!-- Все слова -->
  <section id="allWords" style="display:none;">
    <div class="search-box">
      <input type="text" placeholder="Введите слово для поиска...">
    </div>
    <ul class="word-list">
      <li class="word-item">
        <div class="word-text">
          <div class="word-en">ability</div>
          <div class="word-ru">способность</div>
          <div class="word-def">the power or skill to do something</div>
        </div>
        <button class="add-btn">Учить</button>
      </li>
      <li class="word-item">
        <div class="word-text">
          <div class="word-en">account</div>
          <div class="word-ru">учётная запись</div>
          <div class="word-def">a record of financial expenditure</div>
        </div>
        <button class="add-btn">Учить</button>
      </li>
    </ul>
  </section>

  <!-- TabBar -->
  <nav class="tabbar">
    <button>
      <span class="tabbar-icon">🧠</span>
      <small>Уроки</small>
    </button>
    <button class="active">
      <span class="tabbar-icon">📘</span>
      <small>Словарь</small>
    </button>
    <button>
      <span class="tabbar-icon">🎙️</span>
      <small>Записи</small>
    </button>
    <button>
      <span class="tabbar-icon">⚙️</span>
      <small>Настройки</small>
    </button>
  </nav>

  <script>
    const btnActive = document.getElementById('btnActive');
    const btnAll = document.getElementById('btnAll');
    const activeWords = document.getElementById('activeWords');
    const allWords = document.getElementById('allWords');

    btnActive.addEventListener('click', () => {
      btnActive.classList.add('active');
      btnAll.classList.remove('active');
      activeWords.style.display = '';
      allWords.style.display = 'none';
    });

    btnAll.addEventListener('click', () => {
      btnAll.classList.add('active');
      btnActive.classList.remove('active');
      activeWords.style.display = 'none';
      allWords.style.display = '';
    });
  </script>
</body>
</html>
